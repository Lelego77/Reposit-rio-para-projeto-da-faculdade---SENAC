<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CondoShare</title>
</head>

<body>

    <h1>CondoShare</h1>

    <h2>Cadastrar Item</h2>

    <input
        id="itemName"
        type="text"
        placeholder="Nome do item"
    >

    <input
        id="itemDescription"
        type="text"
        placeholder="Descrição"
    >

    <input
        id="categoryId"
        type="number"
        placeholder="ID da categoria"
    >

    <input
        id="userId"
        type="number"
        placeholder="ID do usuário"
    >

    <button onclick="createItem()">
        Cadastrar
    </button>

    <h2>Itens disponíveis</h2>

    <div id="items"></div>

    <script>

        const API_URL = "https://condoshare-backend.onrender.com";


        async function loadItems() {

            try {

                const res = await fetch(`${API_URL}/items`);

                const items = await res.json();

                const div = document.getElementById("items");

                div.innerHTML = "";

                if (items.length === 0) {

                    div.innerHTML = "<p>Nenhum item cadastrado.</p>";

                    return;
                }

                items.forEach(item => {

                    div.innerHTML += `
                        <div>
                            <p>
                                <strong>${item.nome}</strong>
                            </p>

                            <p>
                                ${item.descricao || ""}
                            </p>

                            <p>
                                Categoria: ${item.categoria}
                            </p>

                            <p>
                                Proprietário: ${item.proprietario}
                            </p>

                            <button onclick="reserveItem(${item.id_item})">
                                Reservar
                            </button>

                            <hr>
                        </div>
                    `;

                });

            } catch (error) {

                console.error(error);

                document.getElementById("items").innerHTML =
                    "<p>Erro ao carregar os itens.</p>";
            }

        }


        async function createItem() {

            const name =
                document.getElementById("itemName").value;

            const description =
                document.getElementById("itemDescription").value;

            const categoryId =
                document.getElementById("categoryId").value;

            const userId =
                document.getElementById("userId").value;


            if (!name || !categoryId || !userId) {

                alert(
                    "Preencha nome, ID da categoria e ID do usuário."
                );

                return;
            }


            try {

                const res = await fetch(`${API_URL}/items`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        name: name,

                        description: description,

                        categoryId: Number(categoryId),

                        userId: Number(userId)

                    })

                });


                const data = await res.json();


                if (!res.ok) {

                    alert(
                        data.error || "Erro ao cadastrar item."
                    );

                    return;
                }


                alert("Item cadastrado com sucesso!");

                document.getElementById("itemName").value = "";

                document.getElementById("itemDescription").value = "";

                loadItems();


            } catch (error) {

                console.error(error);

                alert("Erro ao conectar com o backend.");
            }

        }


        async function reserveItem(itemId) {

            try {

                const res = await fetch(
                    `${API_URL}/reservations`,
                    {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            itemId: itemId,

                            userId: 1,

                            startDate: "2026-09-05",

                            returnDate: "2026-09-06"

                        })

                    }
                );


                const data = await res.json();


                if (!res.ok) {

                    alert(
                        data.error || "Erro ao reservar item."
                    );

                    return;
                }


                alert("Item reservado com sucesso!");


            } catch (error) {

                console.error(error);

                alert("Erro ao conectar com o backend.");
            }

        }


        loadItems();

    </script>

</body>

</html>
